<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbeee6">
<title>How was your day? 💭</title>
<style>
  :root {
    --bg: #fbeee6;
    --card: #fffaf3;
    --card-hi: #fbe3dc;
    --line: #f0d3c6;
    --text: #5c4038;
    --muted: #b08e82;
    --accent: #e0899b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    overflow: hidden;
  }

  /* ---------- Card ---------- */
  .card {
    position: relative;
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 36px 24px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 18px 44px rgba(214, 140, 120, .20), 0 0 0 1px rgba(224, 137, 155, .08);
    transition: transform .2s ease, box-shadow .3s ease;
    user-select: none;
    -webkit-user-select: none;
    z-index: 2;
  }
  .card:active { transform: scale(.985); }
  .card.open { cursor: default; }
  .card.open:active { transform: none; }

  h1 {
    margin: 0;
    font-size: 1.75rem;
    line-height: 1.2;
    font-weight: 700;
    letter-spacing: -.02em;
  }
  .emoji { display: inline-block; animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-4px) rotate(-6deg); } }

  .hint {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: .95rem;
    transition: opacity .3s ease, max-height .4s ease, margin .4s ease;
    max-height: 30px;
    overflow: hidden;
  }
  .card:not(.open) .hint { animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .45; } }
  .card.open .hint { opacity: 0; max-height: 0; margin: 0; }

  /* ---------- Choices ---------- */
  .choices {
    display: grid;
    gap: 12px;
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transform: translateY(14px);
    transition: max-height .6s cubic-bezier(.2, .8, .2, 1), opacity .45s ease, transform .6s cubic-bezier(.2, .8, .2, 1), margin .6s ease;
  }
  .card.open .choices {
    max-height: 560px;
    opacity: 1;
    transform: none;
    margin-top: 26px;
  }
  .choice {
    appearance: none;
    -webkit-appearance: none;
    font: inherit;
    font-size: 1.08rem;
    font-weight: 600;
    color: var(--text);
    background: var(--card-hi);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    text-align: left;
    cursor: pointer;
    transition: transform .12s ease, background .2s ease, border-color .2s ease;
  }
  .choice .ico { font-size: 1.5rem; line-height: 1; }
  .choice:active { transform: scale(.96); background: #f7d3cb; border-color: var(--accent); }
  .choice.picked { border-color: var(--accent); background: #f8d9d2; }
  .choices.done .choice:not(.picked) { opacity: .45; }
  .card.open .choice { animation: pop .5s cubic-bezier(.2, .9, .3, 1.3) both; }
  .card.open .choice:nth-child(1) { animation-delay: .08s; }
  .card.open .choice:nth-child(2) { animation-delay: .16s; }
  .card.open .choice:nth-child(3) { animation-delay: .24s; }
  .card.open .choice:nth-child(4) { animation-delay: .32s; }
  .card.open .choice:nth-child(5) { animation-delay: .40s; }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.94); } }

  /* ---------- Effects layer ---------- */
  #fx, #confetti {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
  }
  #fx { overflow: hidden; }
  .p {
    position: absolute;
    will-change: transform, opacity;
    line-height: 1;
  }

  @media (prefers-reduced-motion: reduce) {
    .emoji, .card:not(.open) .hint { animation: none; }
  }
</style>
</head>
<body>

<main class="card" id="card" role="button" tabindex="0" aria-expanded="false">
  <h1>How was your day? <span class="emoji">💭</span></h1>
  <p class="hint">Tap to open...</p>

  <div class="choices" id="choices">
    <button class="choice" data-mood="really_tired"><span class="ico">🥲</span>Really really tiredd</button>
    <button class="choice" data-mood="tired"><span class="ico">😴</span>Tiredd</button>
    <button class="choice" data-mood="normal"><span class="ico">🙂</span>Normal</button>
    <button class="choice" data-mood="great"><span class="ico">✨</span>Greatt</button>
    <button class="choice" data-mood="super"><span class="ico">🎉</span>Super greatt</button>
  </div>
</main>

<div id="fx" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
/* ============ SETTINGS (edit these) ============ */
// Your secret ntfy topic. Subscribe to the SAME name in the ntfy app.
const NTFY_TOPIC = "peteryee";
const NAME = "Cam tuyet";   // shown in your notification

const LABELS = {
  tired:  "😴 Tiredd",
  really_tired: "🥲 Really really tiredd",
  normal: "🙂 Normal",
  great:  "✨ Greatt",
  super:  "🎉 Super greatt"
};
/* ================================================ */

const card = document.getElementById("card");
const choices = document.getElementById("choices");
const fx = document.getElementById("fx");
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/* ---------- Open card ---------- */
function openCard() {
  if (card.classList.contains("open")) return;
  card.classList.add("open");
  card.setAttribute("aria-expanded", "true");
}
card.addEventListener("click", openCard);
card.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openCard(); }
});

/* ---------- Notification (silent, via ntfy) ---------- */
const sent = new Set();
function notify(mood) {
  if (sent.has(mood)) return;            // one ping per choice per visit
  sent.add(mood);
  if (!NTFY_TOPIC) return;
  const time = new Date().toLocaleString();
  const payload = {
    topic: NTFY_TOPIC,
    title: `💭 ${NAME}'s day`,
    message: `${LABELS[mood]}\n🕒 ${time}`,
    priority: 4
  };
  try {
    fetch("https://ntfy.sh/", {
      method: "POST",
      body: JSON.stringify(payload),
      keepalive: true
    }).catch(() => {});
  } catch (_) {}
}

/* ---------- Particle helper ---------- */
function spawn(char, x, y, size, keyframes, opts) {
  const el = document.createElement("span");
  el.className = "p";
  el.textContent = char;
  el.style.left = x + "px";
  el.style.top = y + "px";
  el.style.fontSize = size + "px";
  if (opts.glow) el.style.textShadow = opts.glow;
  fx.appendChild(el);
  const anim = el.animate(keyframes, {
    duration: opts.duration,
    delay: opts.delay || 0,
    easing: opts.easing || "linear",
    fill: "both"
  });
  anim.onfinish = () => el.remove();
}

/* ---------- 😴 Tired: slow drifting rain ---------- */
function effectTired() {
  const chars = ["😴", "💤", "🌙"];
  const n = reduceMotion ? 8 : 30;
  for (let i = 0; i < n; i++) {
    const x = rand(0, innerWidth - 30);
    const sway = rand(-40, 40);
    const rot = rand(-25, 25);
    spawn(pick(chars), x, -50, rand(22, 40), [
      { transform: "translate(0,0) rotate(0deg)", opacity: 0 },
      { opacity: .9, offset: .12 },
      { transform: `translate(${sway}px, ${innerHeight * .55}px) rotate(${rot}deg)`, opacity: .85, offset: .55 },
      { transform: `translate(${-sway}px, ${innerHeight + 100}px) rotate(${-rot}deg)`, opacity: 0 }
    ], { duration: rand(5000, 8000), delay: rand(0, 2200), easing: "ease-in-out" });
  }
}

/* ---------- 🥲 Really really tired: heavy, slow, teary drift ---------- */
function effectReallyTired() {
  const chars = ["🥲", "💧", "💤", "🌧️", "😴"];
  const n = reduceMotion ? 10 : 42;
  for (let i = 0; i < n; i++) {
    const x = rand(0, innerWidth - 30);
    const sway = rand(-25, 25);
    spawn(pick(chars), x, -50, rand(24, 44), [
      { transform: "translate(0,0) rotate(0deg)", opacity: 0 },
      { opacity: .95, offset: .1 },
      { transform: `translate(${sway}px, ${innerHeight * .5}px) rotate(${rand(-15, 15)}deg)`, opacity: .9, offset: .6 },
      { transform: `translate(${-sway}px, ${innerHeight + 100}px) rotate(0deg)`, opacity: 0 }
    ], { duration: rand(7000, 10500), delay: rand(0, 3000), easing: "ease-in-out" });
  }
}

/* ---------- 🙂 Normal: gentle floating pulses ---------- */
function effectNormal() {
  const chars = ["🙂", "✨"];
  const n = reduceMotion ? 5 : 14;
  for (let i = 0; i < n; i++) {
    const x = rand(20, innerWidth - 50);
    const y = rand(innerHeight * .45, innerHeight - 40);
    const drift = rand(-30, 30);
    spawn(pick(chars), x, y, rand(26, 44), [
      { transform: "translate(0,0) scale(.6)", opacity: 0 },
      { transform: `translate(${drift * .3}px,-60px) scale(1.15)`, opacity: .9, offset: .3 },
      { transform: `translate(${drift * .6}px,-120px) scale(.95)`, opacity: .85, offset: .6 },
      { transform: `translate(${drift}px,-210px) scale(1.1)`, opacity: 0 }
    ], { duration: rand(3200, 4800), delay: rand(0, 1400), easing: "ease-in-out" });
  }
}

/* ---------- ✨ Great: glowing sparkle burst ---------- */
function effectGreat(originEl) {
  const r = originEl.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;
  const chars = ["✨", "⭐", "🌟"];
  const n = reduceMotion ? 10 : 36;
  for (let i = 0; i < n; i++) {
    const ang = rand(0, Math.PI * 2);
    const dist = rand(90, Math.max(180, innerWidth * .6));
    const dx = Math.cos(ang) * dist;
    const dy = Math.sin(ang) * dist - rand(10, 60);
    spawn(pick(chars), cx, cy, rand(16, 34), [
      { transform: "translate(-50%,-50%) scale(0) rotate(0deg)", opacity: 1 },
      { transform: `translate(calc(-50% + ${dx * .7}px), calc(-50% + ${dy * .7}px)) scale(1.3) rotate(120deg)`, opacity: 1, offset: .5 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy + 50}px)) scale(.4) rotate(260deg)`, opacity: 0 }
    ], {
      duration: rand(1300, 2300),
      delay: rand(0, 250),
      easing: "cubic-bezier(.15,.7,.3,1)",
      glow: "0 0 10px rgba(253,224,71,.9), 0 0 22px rgba(251,191,36,.6)"
    });
  }
}

/* ---------- 🎉 Super great: canvas confetti ---------- */
const cv = document.getElementById("confetti");
const ctx = cv.getContext("2d");
let pieces = [];
let raf = null;
const COLORS = ["#f472b6", "#fbbf24", "#34d399", "#60a5fa", "#a78bfa", "#fb7185", "#fde047"];

function sizeCanvas() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr;
  cv.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
sizeCanvas();
addEventListener("resize", sizeCanvas);

function cannon(x, y, angle, count) {
  for (let i = 0; i < count; i++) {
    const a = angle + rand(-.45, .45);
    const v = rand(9, 20);
    pieces.push({
      x, y,
      vx: Math.cos(a) * v,
      vy: Math.sin(a) * v,
      w: rand(6, 11), h: rand(4, 8),
      rot: rand(0, 6.28), vr: rand(-.3, .3),
      color: pick(COLORS),
      tilt: rand(0, 6.28),
      life: 0
    });
  }
}

function tick() {
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  pieces = pieces.filter(p => p.y < innerHeight + 30 && p.life < 260);
  for (const p of pieces) {
    p.vy += .35;           // gravity
    p.vx *= .985;
    p.vy *= .985;
    p.x += p.vx;
    p.y += p.vy;
    p.rot += p.vr;
    p.tilt += .15;
    p.life++;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = Math.max(0, 1 - p.life / 260);
    ctx.fillStyle = p.color;
    ctx.scale(1, Math.cos(p.tilt));   // flutter
    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    ctx.restore();
  }
  raf = pieces.length ? requestAnimationFrame(tick) : null;
  if (!raf) ctx.clearRect(0, 0, innerWidth, innerHeight);
}

function effectSuper() {
  const n = reduceMotion ? 40 : 130;
  const y = innerHeight * .85;
  cannon(0, y, -Math.PI / 3, n);
  cannon(innerWidth, y, -Math.PI * 2 / 3, n);
  setTimeout(() => cannon(innerWidth / 2, innerHeight * .6, -Math.PI / 2, n), 280);
  setTimeout(() => cannon(innerWidth * .2, -10, Math.PI / 2, n / 2), 650);
  setTimeout(() => cannon(innerWidth * .8, -10, Math.PI / 2, n / 2), 800);
  if (!raf) raf = requestAnimationFrame(tick);
}

/* ---------- Choice handling ---------- */
choices.addEventListener("click", e => {
  const btn = e.target.closest(".choice");
  if (!btn) return;
  e.stopPropagation();
  const mood = btn.dataset.mood;

  choices.classList.add("done");
  choices.querySelectorAll(".choice").forEach(b => b.classList.toggle("picked", b === btn));
  if (navigator.vibrate) navigator.vibrate(20);

  notify(mood);

  if (mood === "tired") effectTired();
  else if (mood === "really_tired") effectReallyTired();
  else if (mood === "normal") effectNormal();
  else if (mood === "great") effectGreat(btn);
  else if (mood === "super") effectSuper();
});
</script>
</body>
</html>
